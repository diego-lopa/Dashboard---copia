proxy_cache_path /var/cache/nginx/osm levels=1:2 keys_zone=osm:10m inactive=7d max_size=500m use_temp_path=off;

# Resolutor de Docker: con `resolver` + variables en proxy_pass, nginx NO
# cachea la IP del backend al arrancar. Si el contenedor backend-api se
# recrea (cambia de IP), el proxy sigue funcionando en lugar de dar 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Proxy de teselas OSM (mismo origen -> cumple Tile Usage Policy y evita 403 en devtunnels)
    # ^~ evita que el bloque de assets estáticos (~* \.png$) lo intercepte
    location ^~ /osm/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "CORNEA/1.0 (+https://github.com/neutroninsights/cornea)";
        proxy_set_header Referer "https://cornea.neutroninsights.com/";
        proxy_cache osm;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Healthcheck raíz (backend expone GET /health fuera de /api)
    location = /health {
        set $api_upstream backend-api:8000;
        proxy_pass http://$api_upstream/health;
        proxy_set_header Host $host;
    }

    # Proxy inverso transparente hacia la API backend interna
    # (variable a propósito: resuelve el backend en cada request, no al arrancar)
    location /api/ {
        set $api_upstream backend-api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) optimizaciones
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Enrutamiento React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
