# ==============================================================================
# CONFIGURACIÓN ECLIPSE MOSQUITTO 2.X
# ==============================================================================

# Puerto MQTT estándar para comunicación interna (ChirpStack, Backend Workers, Simulator)
listener 1883 0.0.0.0
protocol mqtt

# Puerto WebSockets opcional si se requiere inspección directa segura
listener 9001 0.0.0.0
protocol websockets

# Persistencia de mensajes encolados
persistence true
persistence_location /mosquitto/data/

# Seguridad y Autenticación
allow_anonymous false
password_file /mosquitto/data/passwordfile

# Configuración de Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Límites de rendimiento y buffering
max_queued_messages 10000
max_inflight_messages 100
max_packet_size 268435456
